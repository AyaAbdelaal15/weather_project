<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="A responsive weather application that provides current weather and a three-day forecast."
    />

    <title>Weather App</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="./css/bootstrap.min.css" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="./css/all.min.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <!-- ==================== Header ==================== -->
    <header class="site-header">
      <nav class="navbar navbar-expand-lg">
        <div class="container">
          <!-- Logo -->
          <a href="#" class="navbar-brand logo">
            <img src="./imgs/logo.png" alt="Weather logo" />

            <div class="logo-content">
              <h1>Weather</h1>
              <span>Tagline goes here</span>
            </div>
          </a>

          <!-- Mobile Menu Button -->
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
            aria-controls="mainNavbar"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <!-- Navigation -->
          <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link active" href="#home"> Home </a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="#"> News </a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="#"> Live Cameras </a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="#"> Photos </a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="#contact"> Contact </a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <!-- ==================== Main ==================== -->
    <main>
      <!-- Hero / Weather Section -->
      <section class="hero" id="home">
        <div class="container">
          <!-- Search -->
          <form class="weather-search" id="weatherForm">
            <label for="search" class="visually-hidden">
              Search for a city
            </label>

            <input
              type="search"
              id="search"
              class="form-control"
              placeholder="Find your location..."
              autocomplete="off"
            />

            <button type="submit" class="search-btn">Find</button>
          </form>

          <!-- Loading State -->
          <div class="loading d-none" id="loading" aria-live="polite">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <span>Loading weather...</span>
          </div>

          <!-- Error Message -->
          <div
            class="weather-error d-none"
            id="weatherError"
            role="alert"
          ></div>

          <!-- Weather Cards -->
          <div class="weather-grid">
            <!-- ================= Today ================= -->
            <article class="weather-card today-card">
              <header class="weather-card-header">
                <span id="todayName">Sunday</span>

                <span>
                  <span id="todayDate">30</span>
                  <span id="todayMonth">May</span>
                </span>
              </header>

              <div class="weather-card-body">
                <p class="location" id="todayLocation">Cairo</p>

                <div class="current-temperature">
                  <h2>
                    <span id="todayTemp">40</span>
                    <sup>°C</sup>
                  </h2>
                </div>

                <p class="weather-condition" id="todayWeather">Sunny</p>

                <div class="weather-details">
                  <div class="weather-detail">
                    <i class="fa-solid fa-umbrella"></i>
                    <span id="umbrella">20%</span>
                  </div>

                  <div class="weather-detail">
                    <i class="fa-solid fa-wind"></i>
                    <span id="wind">18 km/h</span>
                  </div>

                  <div class="weather-detail">
                    <i class="fa-regular fa-compass"></i>
                    <span id="compass">East</span>
                  </div>
                </div>
              </div>
            </article>

            <!-- ================= Tomorrow ================= -->
            <article class="weather-card forecast-card">
              <header class="weather-card-header">
                <span id="tomorrow">Monday</span>
              </header>

              <div class="weather-card-body">
                <img
                  src="./imgs/113.webp"
                  alt="Weather condition"
                  class="weather-icon"
                  id="tomorrowImg"
                />

                <h2 class="forecast-max-temp">
                  <span id="tomorrowMaxTemp">40</span>
                  <sup>°C</sup>
                </h2>

                <p class="forecast-min-temp">
                  <span id="tomorrowMinTemp">39</span>
                  <sup>°C</sup>
                </p>

                <p class="weather-condition" id="tomorrowWeather">Sunny</p>
              </div>
            </article>

            <!-- ================= After Tomorrow ================= -->
            <article class="weather-card forecast-card">
              <header class="weather-card-header">
                <span id="afterTomorrow"> Tuesday </span>
              </header>

              <div class="weather-card-body">
                <img
                  src="./imgs/113.webp"
                  alt="Weather condition"
                  class="weather-icon"
                  id="afterTomorrowImg"
                />

                <h2 class="forecast-max-temp">
                  <span id="afterTomMaxTemp">39</span>
                  <sup>°C</sup>
                </h2>

                <p class="forecast-min-temp">
                  <span id="afterTomMinTemp">25</span>
                  <sup>°C</sup>
                </p>

                <p class="weather-condition" id="afterWeather">Sunny</p>
              </div>
            </article>
          </div>
        </div>
      </section>
    </main>

    <!-- ==================== Footer ==================== -->
    <footer class="site-footer" id="contact">
      <div class="container">
        <div class="footer-content">
          <!-- Subscribe -->
          <form class="subscribe-form" id="subscribeForm">
            <label for="email" class="visually-hidden"> Email address </label>

            <input
              type="email"
              id="email"
              placeholder="Enter your email to subscribe..."
              autocomplete="email"
            />

            <button type="submit">Subscribe</button>
          </form>

          <!-- Social Links -->
          <div class="social-links">
            <a href="#" aria-label="Facebook">
              <i class="fa-brands fa-facebook-f"></i>
            </a>

            <a href="#" aria-label="Twitter">
              <i class="fa-brands fa-twitter"></i>
            </a>

            <a href="#" aria-label="Google Plus">
              <i class="fa-brands fa-google-plus-g"></i>
            </a>

            <a href="#" aria-label="Pinterest">
              <i class="fa-brands fa-pinterest"></i>
            </a>
          </div>
        </div>

        <p class="copyright">
          Copyright 2014 Company name. Designed by Themezy. All rights reserved.
        </p>
      </div>
    </footer>

    <!-- Bootstrap -->
    <script src="./js/bootstrap.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="./js/main.js"></script>
  </body>
</html>
